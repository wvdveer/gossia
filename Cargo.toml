[workspace]
members = ["crates/*"]
# The helper tools are a separate workspace so that they build and run before
# vendor/ has been fetched (see DESIGN.md, Build and dependencies).
exclude = ["tools", "vendor"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
# Required by RustPython and its ruff fork; see DESIGN.md, Build and dependencies.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/wvdveer/gossia"

[workspace.dependencies]
gossia-core = { path = "crates/gossia-core" }
gossia-calc = { path = "crates/gossia-calc" }
gossia-std = { path = "crates/gossia-std" }
gossia-layout = { path = "crates/gossia-layout" }
gossia-report = { path = "crates/gossia-report" }
gossia-user = { path = "crates/gossia-user" }
gossia-i18n = { path = "crates/gossia-i18n" }

[workspace.metadata.gossia]
# Vendor items (see vendor.lock) that the workspace needs. `cargo xtask` fetches
# these before it starts Cargo, because Cargo needs every path dependency to
# exist before any build script can run. RustPython and ruff are added here by
# build step 3.
vendor = ["rustpython", "ruff", "egui-file-dialog", "json-schema-test-suite", "winit"]

# winit with the fix in vendor-patches/winit.patch: on Windows a theme set
# with set_theme is kept when the system's settings change (vendor.lock).
[patch.crates-io]
winit = { path = "vendor/winit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# RustPython's evaluator keeps oversized native frames active when it is not
# optimised, which overflows the stack during startup (DESIGN.md, "Python
# engine"). Dependencies are therefore optimised in every profile, as RustPython
# does in its own workspace.
[profile.dev.package."*"]
opt-level = 3
# Dependencies keep only line tables (backtraces still name file and line):
# full debug information for RustPython in every test binary filled 150 GB
# of target/ on Windows. Our own crates keep full debug information.
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 3
debug = "line-tables-only"
