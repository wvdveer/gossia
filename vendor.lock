# Pins for the dependencies that are fetched into vendor/ (see DESIGN.md,
# "Build and dependencies"). vendor/ itself is not committed.
# `rev` must be a full 40-character commit hash.
version = 1

[[item]]
name = "rustpython"
url  = "https://github.com/RustPython/RustPython"
rev  = "e5554e23abfbaee85508c32fc22e5074f88aebdd"
# Makes the four ruff crates path dependencies on the ruff item below, so that
# Cargo never checks the ruff repository out (see DESIGN.md, "Build and
# dependencies").
patch = "vendor-patches/rustpython.patch"

[[item]]
name   = "ruff"
url    = "https://github.com/RustPython/ruff.git"
rev    = "9290a8849542134d83f77e9360e7f0b93897fd93"
sparse = [
    "crates/ruff_python_ast",
    "crates/ruff_python_parser",
    "crates/ruff_python_trivia",
    "crates/ruff_source_file",
    "crates/ruff_text_size",
    "crates/ruff_unicode_names2",
    "crates/ruff_unicode_names2_generator",
]

# Test-only: the official JSON Schema Test Suite (DESIGN.md, Testing and CI,
# "Selecting JSON Schema Test Suite cases"). Only the 2020-12 cases are used.
[[item]]
name   = "json-schema-test-suite"
url    = "https://github.com/json-schema-org/JSON-Schema-Test-Suite.git"
rev    = "89e83a74014617ffbe79a56d83d14d054cd11417"
sparse = ["tests/draft2020-12"]
