name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Jobs run on a self-hosted GitHub Actions runner on the acer server, registered
# for this repository with the label `cliotree` (see README, "CI runner").
# There is no rust-cache or vendor cache: the workspace persists between runs, and
# rust-cache's cleanup would delete rustup from ~/.cargo/bin on a shared machine.
jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, cliotree]
    steps:
      - uses: actions/checkout@v4
        with:
          # The runner is persistent: keep target/ and vendor/ between runs.
          clean: false
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo xtask lint

  test:
    name: Test
    runs-on: [self-hosted, cliotree]
    steps:
      - uses: actions/checkout@v4
        with:
          # The runner is persistent: keep target/ and vendor/ between runs.
          clean: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo xtask test

  # Exercises the fetch script itself on Linux: every pinned item is fetched and
  # checked against vendor.lock, whether or not the workspace uses it yet.
  vendor:
    name: Vendor
    runs-on: [self-hosted, cliotree]
    steps:
      - uses: actions/checkout@v4
        with:
          # The runner is persistent: keep target/ and vendor/ between runs.
          clean: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo xtask vendor fetch
      - run: cargo xtask vendor verify
