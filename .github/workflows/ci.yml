name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Jobs run on a self-hosted GitHub Actions runner on the acer server, registered
# for this repository with the label `cliotree` (see README, "CI runner").
jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, cliotree]
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('vendor.lock') }}
      - run: cargo xtask lint

  test:
    name: Test
    runs-on: [self-hosted, cliotree]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('vendor.lock') }}
      - run: cargo xtask test

  # Exercises the fetch script itself on Linux: every pinned item is fetched and
  # checked against vendor.lock, whether or not the workspace uses it yet.
  vendor:
    name: Vendor
    runs-on: [self-hosted, cliotree]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('vendor.lock') }}
      - run: cargo xtask vendor fetch
      - run: cargo xtask vendor verify
