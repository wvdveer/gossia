name: CI

# Lint and the tests on GitHub's own Ubuntu runners, for pushes to main and
# for pull requests, so that a contributor sees the checks. Nothing here runs
# on a machine of the project's: the jobs that need a display, a graphics
# adapter, test databases or the package registry run only on the Gitea
# mirror (.gitea/workflows), which only the owner pushes to.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The build is larger than the free space on the runner's system disk; the
  # second disk at /mnt has room for it.
  CARGO_TARGET_DIR: /mnt/target
  # Without debug information the test programs are a fraction of their
  # size: with it, linking them filled the runner's disk (ld died with a bus
  # error). CI has no use for it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: bash .github/prepare-runner.sh
      - run: cargo xtask lint
      - name: Disk space
        if: always()
        run: df -h / /mnt

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: bash .github/prepare-runner.sh
      - run: cargo xtask test
      - name: Disk space
        if: always()
        run: df -h / /mnt
