version = 1

# Keywords a test group may use and still run as pass or fail
# (DESIGN.md, Testing and CI). `title`, `description`, `$schema` and `$defs`
# never change what a schema accepts and are always allowed.
allowed = [
    "type", "properties", "required", "items", "minItems", "maxItems",
    "minimum", "maximum", "minLength", "maxLength", "pattern", "enum",
    "$ref", "additionalProperties", "format",
]

