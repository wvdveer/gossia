[package]
name = "gossia-cli"
description = "Gossia from the command line: runs a workbook's report to PDF, without a window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bidwillii"
path = "src/main.rs"

[lib]
name = "gossia_cli"
path = "src/lib.rs"

[dependencies]
gossia-core.workspace = true
gossia-calc.workspace = true
gossia-report.workspace = true
gossia-user.workspace = true
gossia-i18n.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[dev-dependencies]
# Reads the text of the PDFs written back.
pdf-extract = "0.12.1"

[lints]
workspace = true
