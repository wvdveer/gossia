[package]
name = "cliotree-calc"
description = "Formulas, the dependency graph, recalculation, error values, and the Python engine interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cliotree-core.workspace = true
cliotree-std.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
indexmap = "2.14.2"
# The derive macros of RustPython name `rustpython_vm` in the code they write,
# so the crate has to be a direct dependency as well as the one below.
rustpython-vm = { path = "../../vendor/rustpython/crates/vm", default-features = false }
rustpython = { path = "../../vendor/rustpython", default-features = false, features = ["freeze-stdlib"] }
ruff_python_ast = { package = "rustpython-ruff_python_ast", path = "../../vendor/ruff/crates/ruff_python_ast" }
ruff_python_parser = { package = "rustpython-ruff_python_parser", path = "../../vendor/ruff/crates/ruff_python_parser" }
ruff_source_file = { package = "rustpython-ruff_source_file", path = "../../vendor/ruff/crates/ruff_source_file" }
ruff_text_size = { package = "rustpython-ruff_text_size", path = "../../vendor/ruff/crates/ruff_text_size" }
sha2 = "0.11.1"
# HTTP/HTTPS data sources (DESIGN.md, "Data sources"): blocking, rustls, and
# the operating system's certificate store through the platform verifier.
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
# SQLite data sources: SQLite built in, the progress handler for the call
# timeout, and declared column types to give dates as dates.
rusqlite = { version = "0.41.1", features = ["bundled", "hooks", "column_decltype"] }

[dev-dependencies]
proptest = "1.12.0"

[lints]
workspace = true
