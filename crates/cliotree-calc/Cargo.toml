[package]
name = "cliotree-calc"
description = "Formulas, the dependency graph, recalculation, error values, and the Python engine interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cliotree-core.workspace = true
cliotree-std.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Today's date in the local time zone, for the presets of a report's period
# parameters (the app's date picker uses it too).
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
indexmap = "2.14.2"
# std::time::Instant on the desktop, the browser's clock on wasm, where the
# standard one panics. The version eframe uses.
web-time = "1.1.0"
# The derive macros of RustPython name `rustpython_vm` in the code they write,
# so the crate has to be a direct dependency as well as the one below.
rustpython-vm = { path = "../../vendor/rustpython/crates/vm", default-features = false }
rustpython = { path = "../../vendor/rustpython", default-features = false, features = ["freeze-stdlib"] }
ruff_python_ast = { package = "rustpython-ruff_python_ast", path = "../../vendor/ruff/crates/ruff_python_ast" }
ruff_python_parser = { package = "rustpython-ruff_python_parser", path = "../../vendor/ruff/crates/ruff_python_parser" }
ruff_source_file = { package = "rustpython-ruff_source_file", path = "../../vendor/ruff/crates/ruff_source_file" }
ruff_text_size = { package = "rustpython-ruff_text_size", path = "../../vendor/ruff/crates/ruff_text_size" }
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
# The worker protocol of the wasm version (src/wire.rs): MessagePack.
rmp-serde = "1.3"

# The data source drivers, which the wasm version does not have (DESIGN.md,
# "Data sources": the kinds available depend on the target). Its HTTP
# requests are made by the host instead (Web port, 0.3.0).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# HTTP/HTTPS data sources (DESIGN.md, "Data sources"): blocking, rustls, and
# the operating system's certificate store through the platform verifier.
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
# SQLite data sources: SQLite built in, the progress handler for the call
# timeout, and declared column types to give dates as dates.
rusqlite = { version = "0.41.1", features = ["bundled", "hooks", "column_decltype"] }
postgres = { version = "0.19.14", default-features = false }
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "native-tls"] }
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
bytes = "1.12.1"
beancount-parser = "2.6"
rust_decimal = { version = "1", default-features = false }

# The wasm version takes its random numbers from the browser's crypto API, as
# RustPython's own wasm crate does: getrandom 0.4 for RustPython, 0.2 for
# rand 0.8 below it.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
# The current time and time zone from the browser.
jiff = { version = "0.2.38", default-features = false, features = ["std", "js"] }

# ODBC data sources, on Windows only, where the driver manager (odbc32.dll)
# is part of the system.
[target.'cfg(windows)'.dependencies]
odbc-api = "29.2.0"

[dev-dependencies]
proptest = "1.12.0"

[lints]
workspace = true
