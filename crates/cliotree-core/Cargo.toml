[package]
name = "cliotree-core"
description = "Value, TypeSpec, schema lowering, validation, and format adapters. No UI and no Python."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
indexmap = "2.14.2"
quick-xml = "0.42.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
proptest = "1.12.0"
toml = "1.1.8"
