"Gossia pyplot, Gossia's own charts in the style of matplotlib's pyplot (not matplotlib itself), for chart functions: start with plt.clear(), draw with plot, bar, barh, scatter, hist, pie, boxplot, errorbar, fill_between, text, annotate, legend and world (a map), and end with return plt.svg()." = "Gossia pyplot, os gráficos próprios do Gossia no estilo do pyplot do matplotlib (não é o matplotlib), para funções de gráfico: comece com plt.clear(), desenhe com plot, bar, barh, scatter, hist, pie, boxplot, errorbar, fill_between, text, annotate, legend e world (um mapa) e termine com return plt.svg()."
