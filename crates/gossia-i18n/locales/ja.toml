"{things} uses {name}. It is not changed, and will show #NAME! until it is edited." = "{things} が {name} を使っています。これは変更されず、編集するまで #NAME! を表示します。"
"{thru} is not an item beside {from} at its level" = "{thru} は同じレベルで {from} と並ぶ項目ではありません"
"{transactions} transactions in {accounts} accounts{span}, {files}{problems}, in {ms} ms" = "{accounts} 勘定に {transactions} 件の取引{span}、{files}{problems}、{ms} ミリ秒"
"{url} is not a URL that starts with http:// or https://" = "{url} は http:// または https:// で始まる URL ではありません"
"{value} does not fit in its {count} bytes" = "{value} は {count} バイトに収まりません"
"{value} is too large for a COMP-1" = "{value} は COMP-1 には大きすぎます"
"{value} is too large for its floating point bytes" = "{value} は浮動小数点のバイトに収まりません"
"{value} is too large for its {digits} digits" = "{value} は {digits} 桁に収まりません"
"{VIEW} is not a JSON object, so the workbook's view settings are the defaults." = "{VIEW} は JSON オブジェクトではないため、ワークブックの表示設定は既定値になります。"
"{wanted} is before the start of {loc}" = "{wanted} は {loc} の先頭より前です"
"{wanted} is outside {loc}, which has {len} items; use append to add one" = "{wanted} は {loc} の範囲外です ({len} 項目)。項目を追加するには append を使用してください"
"{what} can be used only in a button procedure or the Immediate window, not in a formula" = "{what} は数式ではなく、ボタンのプロシージャまたはイミディエイト ウィンドウでのみ使用できます"
"{what} cannot be restricted by {facet} in version 1" = "バージョン 1 では {what} を {facet} で制限できません"
"{what} cannot have a line break in it" = "{what} に改行を含めることはできません"
"{what} has a cost but no amount" = "{what} には取得原価がありますが、金額がありません"
"{what} has a price but no amount" = "{what} には価格がありますが、金額がありません"
"{what} is expected here" = "ここには {what} が必要です"
"{what} is not a number: {other}" = "{what} が数値ではありません: {other}"
"{what} is not a number: {text}" = "{what} が数値ではありません: {text}"
"{what} is not text: {other}" = "{what} がテキストではありません: {other}"
"{what} needs an account" = "{what} には勘定が必要です"
"{what} needs both an amount and a currency, or neither" = "{what} には金額と通貨の両方が必要です (またはどちらも不要です)"
"{word} cannot be read: Gossia holds only finite numbers" = "{word} を読み取れません。Gossia が保持できるのは有限の数値だけです"
"{word} is not a usage Gossia reads" = "{word} は Gossia が読み取れる用途ではありません"
"{w} cannot be a link" = "{w} はリンクにできません"
"{w} cannot be a tag" = "{w} はタグにできません"
"{x} cannot be read: Gossia holds only finite numbers" = "{x} を読み取れません。Gossia が保持できるのは有限の数値だけです"
"{x} cannot be stored: NaN and infinity are not allowed" = "{x} は保存できません。NaN と無限大は使用できません"
"{y}-{m}-{d} is not a date" = "{y}-{m}-{d} は日付ではありません"
"matplotlib is not available in Gossia (it needs compiled code). Gossia's own module gossia.pyplot covers common charts in a similar style." = "matplotlib は Gossia では使えません（コンパイル済みのコードが必要なため）。Gossia 独自のモジュール gossia.pyplot で、よく使うグラフを似たスタイルで描けます。"
"Change to {import}" = "{import} に変更"
"Tab {name}: Formulas have a name {name} of their own. Rename the tab; until then, its formulas see the tab." = "タブ {name}: 数式には独自の名前 {name} があります。タブの名前を変更してください。それまでは、数式からはタブが見えます。"
"Map data: Natural Earth (naturalearthdata.com), in the public domain." = "地図データ: Natural Earth (naturalearthdata.com)、パブリックドメイン。"
"Gossia pyplot, Gossia's own charts in the style of matplotlib's pyplot (not matplotlib itself), for chart functions: start with plt.clear(), draw with plot, bar, barh, scatter, hist, pie, boxplot, errorbar, fill_between, text, annotate, legend and world (a map), and end with return plt.svg()." = "Gossia pyplot: matplotlib の pyplot に似たスタイルの Gossia 独自のグラフ（matplotlib そのものではありません）。グラフ関数で使います。plt.clear() で始め、plot、bar、barh、scatter、hist、pie、boxplot、errorbar、fill_between、text、annotate、legend、world（地図）で描き、return plt.svg() で終えます。"
"Remember on this browser" = "このブラウザーに記憶する"
"Off: the password or token is kept until this page is closed, and asked for again in a new session. On: it is kept in this browser's storage for the site, unencrypted, where anything running on the site could read it, until it is removed here or the site's data is cleared." = "オフ: パスワードやトークンはこのページを閉じるまで保持され、新しいセッションで再度求められます。オン: このブラウザーのサイト用ストレージに暗号化されずに保存され、サイト上で実行されるものは何でも読み取れます。ここで削除するか、サイトのデータを消去するまで保存されます。"
"The workbook was not saved: {why}" = "ワークブックは保存されませんでした: {why}"
"{url} does not allow requests from this web page (its answer has no Access-Control-Allow-Origin for this site, so the browser keeps it from Gossia). A site can only be read from the web version if it allows that; the desktop application and the VS Code extension do not have this limit." = "{url} はこのウェブページからのリクエストを許可していません（応答にこのサイト用の Access-Control-Allow-Origin がないため、ブラウザーが Gossia に渡しません）。ウェブ版で読み取れるのは、それを許可するサイトだけです。デスクトップ アプリケーションと VS Code 拡張機能にはこの制限はありません。"
"{url} is on this computer or the local network, which the browser does not let a public web page reach, or the site there does not allow this page's origin. The desktop application and the VS Code extension do not have this limit." = "{url} はこのコンピューターまたはローカル ネットワーク上にあり、ブラウザーは公開ウェブページからのアクセスを許可しないか、そのサイトがこのページのオリジンを許可していません。デスクトップ アプリケーションと VS Code 拡張機能にはこの制限はありません。"
"{url} did not answer within {seconds} s" = "{url} は {seconds} 秒以内に応答しませんでした"
"{url} answered with a redirect, which is not followed" = "{url} はリダイレクトで応答しましたが、リダイレクトはたどりません"
"the response from {url} is larger than the maximum response size of {bytes} bytes" = "{url} からの応答は最大応答サイズの {bytes} バイトを超えています"
"{url} cannot be reached ({detail})" = "{url} に接続できません（{detail}）"
"Menu" = "メニュー"
"Fold the side panel" = "サイド パネルを折りたたむ"
"Unfold the side panel" = "サイド パネルを展開する"
"Opening Gossia in a new window..." = "新しいウィンドウで Gossia を開いています..."
"The browser did not open a new window. Allow pop-ups for this page, or open {site} and drop this file on it." = "ブラウザーが新しいウィンドウを開きませんでした。このページのポップアップを許可するか、{site} を開いてこのファイルをドロップしてください。"
"The workbook is open in Gossia, in the other window." = "ブックは別のウィンドウの Gossia で開かれています。"
"This file holds the Gossia workbook {name}." = "このファイルには Gossia のブック {name} が入っています。"
"Gossia is a free program for structured data with formulas in Python. Its web version opens the workbook in your browser: nothing of it is sent to a server." = "Gossia は、Python の数式を使える構造化データ用の無料プログラムです。Web 版はブックをブラウザーで開き、その内容がサーバーに送られることはありません。"
"Open in Gossia" = "Gossia で開く"
"If the button does nothing, open {site} and drop this file on it." = "ボタンが反応しない場合は、{site} を開いてこのファイルをドロップしてください。"
"this share file is damaged: the workbook in it cannot be read" = "この共有ファイルは壊れています。中のブックを読み込めません"
"this is not a Gossia share file" = "これは Gossia の共有ファイルではありません"
"Save as share file..." = "共有ファイルとして保存..."
"A copy as one .html file that opens the workbook in Gossia's web version, for someone who does not have Gossia" = "Gossia を持っていない人のための、ブックを Gossia の Web 版で開く 1 つの .html ファイルとしてのコピー"
"{name} came from a share file: it is a new workbook, not saved yet." = "{name} は共有ファイルから開かれました。まだ保存されていない新しいブックです。"
"{name} is {size} MB: many mail systems do not take attachments above 20 MB." = "{name} は {size} MB です。多くのメールシステムは 20 MB を超える添付ファイルを受け付けません。"
"Save as share file" = "共有ファイルとして保存"
"Gossia share file" = "Gossia 共有ファイル"
"Gossia share files" = "Gossia 共有ファイル"
