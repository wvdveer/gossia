"matplotlib is not available in Gossia (it needs compiled code). Gossia's own module gossia.pyplot covers common charts in a similar style." = "matplotlib n'est pas disponible dans Gossia (il a besoin de code compilé). Le module propre à Gossia, gossia.pyplot, couvre les graphiques courants dans un style semblable."
"Change to {import}" = "Remplacer par {import}"
"Tab {name}: Formulas have a name {name} of their own. Rename the tab; until then, its formulas see the tab." = "Onglet {name} : Les formules ont leur propre nom {name}. Renommez l'onglet ; d'ici là, ses formules voient l'onglet."
"Map data: Natural Earth (naturalearthdata.com), in the public domain." = "Données cartographiques : Natural Earth (naturalearthdata.com), dans le domaine public."
"Gossia pyplot, Gossia's own charts in the style of matplotlib's pyplot (not matplotlib itself), for chart functions: start with plt.clear(), draw with plot, bar, barh, scatter, hist, pie, boxplot, errorbar, fill_between, text, annotate, legend and world (a map), and end with return plt.svg()." = "Gossia pyplot, les graphiques propres à Gossia dans le style de pyplot de matplotlib (ce n'est pas matplotlib), pour les fonctions de graphique : commencez par plt.clear(), dessinez avec plot, bar, barh, scatter, hist, pie, boxplot, errorbar, fill_between, text, annotate, legend et world (une carte), et terminez par return plt.svg()."
"Remember on this browser" = "Mémoriser dans ce navigateur"
"Off: the password or token is kept until this page is closed, and asked for again in a new session. On: it is kept in this browser's storage for the site, unencrypted, where anything running on the site could read it, until it is removed here or the site's data is cleared." = "Désactivé : le mot de passe ou le jeton est conservé jusqu'à la fermeture de cette page, puis redemandé lors d'une nouvelle session. Activé : il est conservé dans le stockage de ce navigateur pour le site, sans chiffrement, où tout ce qui s'exécute sur le site pourrait le lire, jusqu'à ce qu'il soit supprimé ici ou que les données du site soient effacées."
"The workbook was not saved: {why}" = "Le classeur n'a pas été enregistré : {why}"
"{url} does not allow requests from this web page (its answer has no Access-Control-Allow-Origin for this site, so the browser keeps it from Gossia). A site can only be read from the web version if it allows that; the desktop application and the VS Code extension do not have this limit." = "{url} n'autorise pas les requêtes depuis cette page web (sa réponse n'a pas d'Access-Control-Allow-Origin pour ce site, donc le navigateur la cache à Gossia). La version web ne peut lire qu'un site qui l'autorise ; l'application de bureau et l'extension VS Code n'ont pas cette limite."
"{url} is on this computer or the local network, which the browser does not let a public web page reach, or the site there does not allow this page's origin. The desktop application and the VS Code extension do not have this limit." = "{url} est sur cet ordinateur ou sur le réseau local, que le navigateur ne laisse pas atteindre par une page web publique, ou le site n'autorise pas l'origine de cette page. L'application de bureau et l'extension VS Code n'ont pas cette limite."
