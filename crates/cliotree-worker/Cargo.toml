[package]
name = "cliotree-worker"
description = "The Python side of the wasm version, run in a Web Worker (DESIGN.md, Web port, 0.3.0)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is for wasm; on other targets the crate is empty.
[target.'cfg(target_family = "wasm")'.dependencies]
cliotree-core.workspace = true
cliotree-calc.workspace = true
# The version in the lock file must match the wasm-bindgen command-line tool
# that makes the JavaScript glue (`cargo xtask web` installs that version).
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"

[lints]
workspace = true
