[package]
name = "cliotree-worker"
description = "The Python side of the wasm version, run in a Web Worker (DESIGN.md, Web port, 0.3.0)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cliotree-core.workspace = true
cliotree-calc.workspace = true
# The version in the lock file must match the wasm-bindgen command-line tool
# that makes the JavaScript glue (see web/README.md).
wasm-bindgen = "0.2.129"
serde_json = "1.0.154"

[lints]
workspace = true
