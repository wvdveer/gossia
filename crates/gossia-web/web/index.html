<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gossia</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
  @media (prefers-color-scheme: light) { html, body { background: #f5f5f5; } }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center;
             font: 14px system-ui, sans-serif; color: #888; }
</style>
</head>
<body>
<!-- The application in the browser page, with the browser host behind the
     host interface (host.js; DESIGN.md, The web version on GitHub Pages).
     Add ?open=<file> to open a workbook served beside this page, or ?sample
     for the sample workbook. The test build is driven by harness.html beside
     it. -->
<canvas id="app"></canvas>
<div id="loading">Loading Gossia...</div>
<script type="module">
import init, * as gossia from './pkg/gossia_web.js';
import { browserHost } from './host.js';
const { start_app, file_picked, fetch_answered, fetch_failed, last_panic } = gossia;

// What the host did, for the tests to look at and answer.
const record = { workers: 0, saves: [], files: [], picks: [], dirty: false, opened: [],
                 workbooks: [], workerErrors: [], fetches: [] };
window.testHost = record;
window.lastPanic = () => last_panic();
// The tests answer the last pickFile with a file of their own: text, or
// bytes (a workbook).
record.answerPick = (name, text) => {
  const last = record.picks[record.picks.length - 1];
  const bytes = typeof text === 'string' ? new TextEncoder().encode(text) : new Uint8Array(text);
  file_picked(last.purpose, name, bytes);
};

// The tests answer a request (with answerFetches set) themselves:
// answerFetch(i, status, text) or failFetch(i, message), i its place in
// record.fetches.
record.answerFetch = (i, status, text, headers = []) => {
  fetch_answered(record.fetches[i].id, status, status === 200 ? 'OK' : '', headers,
                 new TextEncoder().encode(text));
};
record.failFetch = (i, message) => fetch_failed(record.fetches[i].id, message);

(async () => {
  try {
    await init();
    const host = await browserHost(gossia, record);
    record.host = host;
    let name = null, bytes = null;
    const query = new URLSearchParams(location.search);
    const open = query.get('open');
    if (open) {
      const reply = await fetch(open);
      if (!reply.ok) throw new Error(`${open}: ${reply.status} ${reply.statusText}`);
      name = open.split('/').pop();
      bytes = new Uint8Array(await reply.arrayBuffer());
    }
    await start_app(document.getElementById('app'), host, name, bytes, query.has('sample'));
    document.getElementById('loading').remove();
    // The test build's commands (the test control protocol), for the
    // harness page: gossiaControl(cmd, args) gives the result, or fails with
    // the error. A release build has no control().
    if (gossia.control) {
      window.gossiaControl = async (cmd, args = null) =>
        JSON.parse(await gossia.control(cmd, JSON.stringify(args)));
    }
    window.appStarted = true;
  } catch (err) {
    let panic = null;
    try { panic = last_panic(); } catch (_) { /* unusable */ }
    const text = `Gossia did not start: ${err}${panic ? '\n' + panic : ''}`;
    document.getElementById('loading').textContent = text;
    window.appError = text;
    console.error(text);
  }
})();
</script>
</body>
</html>
