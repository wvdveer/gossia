[package]
name = "cliotree-user"
description = "What belongs to the user rather than a workbook (preferences, trust record, data sources), and reading and writing .clio files. No egui: the application and cliotree-cli share it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cliotree-core.workspace = true
cliotree-calc.workspace = true
serde_json = "1.0.154"
# Deflate in pure Rust (no C library, no encryption): a .clio is an ordinary zip.
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }
