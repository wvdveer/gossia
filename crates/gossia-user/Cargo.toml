[package]
name = "gossia-user"
description = "What belongs to the user rather than a workbook (preferences, trust record, data sources), and reading and writing .gossia files. No egui: the application and bidwillii share it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
gossia-core.workspace = true
gossia-calc.workspace = true
gossia-i18n.workspace = true
serde_json = "1.0.154"
base64 = "0.22.1"
# A clock that works in the browser too (the same one gossia-calc uses).
web-time = "1.1.0"
# Deflate in pure Rust (no C library, no encryption): a .gossia is an ordinary zip.
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }
